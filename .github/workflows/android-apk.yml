name: Build Android APK
on:
  push:
    branches:
      - feature/gemini-groq-cloudflare-fallback
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android app
        run: npx cap sync android
      - name: Apply Persian emblem as Android launcher icon
        run: |
          set -e
          SRC="src/assets/images/royal_persian_emblem_1791230254307.jpg"
          test -s "$SRC"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            convert "$SRC" -auto-orient -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taraneh-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
